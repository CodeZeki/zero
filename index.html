<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <title>Farbwechsel</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <div style="display: flex;">
    <div id="center" style="height: 300px; width: 300px; border-radius: 50%; background-color: black;"></div>
    <div class="buttons">
      <button style="background-color: blue;" id="blue" onclick="ColorChanger.handleClick(this)">Blau</button>
      <button style="background-color: red;" id="red" onclick="ColorChanger.handleClick(this)">Rot</button>
      <button style="background-color: green;" id="green" onclick="ColorChanger.handleClick(this)">Grün</button>
      <button style="background-color: yellow;" id="yellow" onclick="ColorChanger.handleClick(this)">Gelb</button>
    </div>


  </div>
</body>

</html>
